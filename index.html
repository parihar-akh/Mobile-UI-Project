# Mobile-UI-Project

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
.phone-wrap{display:flex;justify-content:center;padding:20px 0;background:var(--color-background-secondary);border-radius:16px}
.phone{width:320px;background:#1a1a2e;border-radius:40px;border:6px solid #2a2a3e;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;position:relative}
.notch{width:100px;height:22px;background:#1a1a2e;border-radius:0 0 16px 16px;margin:0 auto;position:relative;z-index:10}
.screen{min-height:580px;position:relative;overflow:hidden}

.lock-screen{position:absolute;inset:0;background:#0f0f1a;display:flex;flex-direction:column;align-items:center;padding:30px 20px 20px;z-index:5}
.lock-time{font-size:56px;font-weight:300;color:#fff;line-height:1;margin-top:10px}
.lock-date{font-size:14px;color:rgba(255,255,255,0.7);margin-top:6px;margin-bottom:40px}
.lock-wallpaper{position:absolute;inset:0;background:#0f0f1a;z-index:-1}
.stars{position:absolute;inset:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:0.3}50%{opacity:1}}
.lock-icons{display:flex;gap:16px;margin-bottom:30px}
.lock-icon{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:18px}
.swipe-hint{color:rgba(255,255,255,0.5);font-size:12px;margin-top:8px}
.lock-arrow{font-size:20px;color:rgba(255,255,255,0.4)}

.password-screen{position:absolute;inset:0;background:#0f0f1a;display:flex;flex-direction:column;align-items:center;padding:40px 24px 20px;z-index:6}
.pw-title{color:#fff;font-size:18px;font-weight:500;margin-bottom:8px}
.pw-sub{color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:30px}
.pw-dots{display:flex;gap:14px;margin-bottom:30px}
.pw-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.4);background:transparent;transition:background 0.15s}
.pw-dot.filled{background:#fff;border-color:#fff}
.pw-input-row{display:flex;align-items:center;gap:8px;margin-bottom:24px;width:100%}
.pw-input{flex:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:12px 14px;color:#fff;font-size:16px;outline:none;letter-spacing:2px}
.pw-input::placeholder{color:rgba(255,255,255,0.3);letter-spacing:0}
.pw-eye{width:40px;height:40px;background:rgba(255,255,255,0.1);border:none;border-radius:10px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pw-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pw-key{background:rgba(255,255,255,0.1);border:none;border-radius:14px;height:54px;color:#fff;font-size:20px;font-weight:500;cursor:pointer;transition:background 0.1s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pw-key:active{background:rgba(255,255,255,0.25)}
.pw-key-sub{font-size:8px;color:rgba(255,255,255,0.4);font-weight:400;letter-spacing:1px;margin-top:1px}
.pw-key.special{background:transparent;font-size:14px;color:rgba(255,255,255,0.7)}
.pw-key.del{background:rgba(255,255,255,0.08)}
.pw-error{color:#e24b4a;font-size:12px;margin-top:8px;min-height:18px}

.home-screen{position:absolute;inset:0;background:#1a1a2e;display:flex;flex-direction:column;z-index:7}
.home-status{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 0;color:#fff}
.home-time-small{font-size:13px;font-weight:500;color:#fff}
.home-status-icons{display:flex;gap:5px;align-items:center;font-size:11px;color:#fff}
.home-wallpaper{position:absolute;inset:0;background:#1a1a2e;z-index:-1}
.home-top{padding:16px 18px 8px;text-align:center}
.home-clock{font-size:42px;font-weight:300;color:#fff;line-height:1}
.home-date{font-size:12px;color:rgba(255,255,255,0.65);margin-top:3px}
.home-weather{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.home-weather-text{font-size:12px;color:rgba(255,255,255,0.7)}
.apps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 14px 8px;flex:1}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.app-icon-img{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform 0.1s}
.app-icon:active .app-icon-img{transform:scale(0.9)}
.app-label{font-size:10px;color:rgba(255,255,255,0.85);text-align:center;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock{background:rgba(255,255,255,0.12);border-radius:24px;margin:8px 14px 14px;padding:10px 14px;display:flex;justify-content:space-around}
.dock-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:transform 0.1s}
.dock-icon:active{transform:scale(0.9)}
.home-bottom{padding:0 18px 8px;display:flex;justify-content:space-between;align-items:center}
.home-dots{display:flex;gap:5px}
.home-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.3)}
.home-dot.active{background:#fff}

.open-screen{position:absolute;inset:0;background:#fff;z-index:8;display:flex;flex-direction:column}
.open-header{background:#1a1a2e;padding:10px 16px;display:flex;align-items:center;gap:10px}
.open-back{color:#fff;font-size:18px;cursor:pointer;padding:4px 8px}
.open-title{color:#fff;font-size:15px;font-weight:500}
.open-content{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;background:#f5f5f5}
.open-app-big{font-size:64px;margin-bottom:12px}
.open-app-name{font-size:18px;font-weight:500;color:#111;margin-bottom:6px}
.open-app-desc{font-size:13px;color:#888;text-align:center}

.hidden{display:none!important}
.slide-up{animation:slideUp 0.3s ease forwards}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.fade-in{animation:fadeIn 0.25s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
</style>

<h2 class="sr-only">Mobile phone UI with lock screen, password entry, and home screen with apps</h2>

<div class="phone-wrap">
<div class="phone">
  <div class="notch"></div>
  <div class="screen">

    <div class="lock-screen" id="lockScreen">
      <div class="lock-wallpaper">
        <div class="stars" id="stars"></div>
      </div>
      <div class="lock-icons">
        <div class="lock-icon">&#128247;</div>
        <div class="lock-icon">&#127995;</div>
      </div>
      <div class="lock-time" id="lockTime">00:00</div>
      <div class="lock-date" id="lockDate">Loading...</div>
      <div style="margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer" onclick="showPassword()">
        <div class="lock-arrow">&#8679;</div>
        <div class="swipe-hint">Swipe up to unlock</div>
      </div>
    </div>

    <div class="password-screen hidden" id="passwordScreen">
      <div class="pw-title">Enter passcode</div>
      <div class="pw-sub">Enter 4-digit PIN to unlock</div>
      <div class="pw-dots" id="pwDots">
        <div class="pw-dot" id="d0"></div>
        <div class="pw-dot" id="d1"></div>
        <div class="pw-dot" id="d2"></div>
        <div class="pw-dot" id="d3"></div>
      </div>
      <div class="pw-input-row">
        <input class="pw-input" type="password" id="pwInput" placeholder="Type PIN (1234)" maxlength="4" oninput="onPwType(this.value)">
        <button class="pw-eye" id="eyeBtn" onclick="toggleEye()">&#128065;</button>
      </div>
      <div class="pw-keypad">
        <button class="pw-key" onclick="pressKey('1')">1<span class="pw-key-sub"></span></button>
        <button class="pw-key" onclick="pressKey('2')">2<span class="pw-key-sub">ABC</span></button>
        <button class="pw-key" onclick="pressKey('3')">3<span class="pw-key-sub">DEF</span></button>
        <button class="pw-key" onclick="pressKey('4')">4<span class="pw-key-sub">GHI</span></button>
        <button class="pw-key" onclick="pressKey('5')">5<span class="pw-key-sub">JKL</span></button>
        <button class="pw-key" onclick="pressKey('6')">6<span class="pw-key-sub">MNO</span></button>
        <button class="pw-key" onclick="pressKey('7')">7<span class="pw-key-sub">PQRS</span></button>
        <button class="pw-key" onclick="pressKey('8')">8<span class="pw-key-sub">TUV</span></button>
        <button class="pw-key" onclick="pressKey('9')">9<span class="pw-key-sub">WXYZ</span></button>
        <button class="pw-key special" onclick="showPassword()">&#8592; Back</button>
        <button class="pw-key" onclick="pressKey('0')">0</button>
        <button class="pw-key del" onclick="deleteKey()">&#9003;</button>
      </div>
      <div class="pw-error" id="pwError"></div>
    </div>

    <div class="home-screen hidden" id="homeScreen">
      <div class="home-wallpaper"></div>
      <div class="home-status">
        <div class="home-time-small" id="homeTimeSmall">9:41</div>
        <div class="home-status-icons">
          <span>&#9679;&#9679;&#9679;&#9679;</span>
          <span>WiFi</span>
          <span>&#128267;</span>
        </div>
      </div>
      <div class="home-top">
        <div class="home-clock" id="homeClock">9:41</div>
        <div class="home-date" id="homeDate">Monday, April 20</div>
        <div class="home-weather">
          <span style="font-size:14px">&#9728;</span>
          <span class="home-weather-text">28°C · Indore</span>
        </div>
      </div>
      <div class="apps-grid" id="appsGrid"></div>
      <div style="padding:0 14px 6px;display:flex;justify-content:center;gap:6px">
        <div class="home-dot active"></div>
        <div class="home-dot"></div>
        <div class="home-dot"></div>
      </div>
      <div class="dock" id="dock"></div>
    </div>

    <div class="open-screen hidden" id="openScreen">
      <div class="open-header">
        <div class="open-back" onclick="closeApp()">&#8592;</div>
        <div class="open-title" id="openTitle">App</div>
      </div>
      <div class="open-content">
        <div class="open-app-big" id="openIcon"></div>
        <div class="open-app-name" id="openName"></div>
        <div class="open-app-desc" id="openDesc">Opening app...</div>
      </div>
    </div>

  </div>
</div>
</div>

<script>
const CORRECT_PIN = '1234';
let pinEntered = '';
let showPw = false;

const apps = [
  {icon:'&#127760;',label:'Chrome',bg:'#4285F4',desc:'Google Chrome browser'},
  {icon:'&#9654;',label:'YouTube',bg:'#FF0000',desc:'Watch videos & music'},
  {icon:'&#128247;',label:'Camera',bg:'#1a1a2e',desc:'Take photos & videos'},
  {icon:'&#128241;',label:'Phone',bg:'#1d9e75',desc:'Calls & contacts'},
  {icon:'&#128140;',label:'Messages',bg:'#1d9e75',desc:'SMS & chat'},
  {icon:'&#128248;',label:'Maps',bg:'#4285F4',desc:'Google Maps navigation'},
  {icon:'&#9749;',label:'Gmail',bg:'#EA4335',desc:'Email inbox'},
  {icon:'&#128450;',label:'Drive',bg:'#0F9D58',desc:'Google Drive files'},
  {icon:'&#127932;',label:'Spotify',bg:'#1DB954',desc:'Music streaming'},
  {icon:'&#128421;',label:'Settings',bg:'#888',desc:'Phone settings'},
  {icon:'&#128172;',label:'WhatsApp',bg:'#25D366',desc:'WhatsApp messenger'},
  {icon:'&#128247;',label:'Instagram',bg:'#C13584',desc:'Photos & reels'},
];

const dockApps = [
  {icon:'&#127760;',label:'Chrome',bg:'#4285F4',desc:'Google Chrome browser'},
  {icon:'&#128241;',label:'Phone',bg:'#1d9e75',desc:'Calls & contacts'},
  {icon:'&#128140;',label:'Messages',bg:'#34A853',desc:'SMS & chat'},
  {icon:'&#9749;',label:'Gmail',bg:'#EA4335',desc:'Email inbox'},
];

function makeStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.cssText=`width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
    c.appendChild(s);
  }
}

function updateTime(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const smonths=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const timeStr=h+':'+m;
  const dateStr=days[now.getDay()]+', '+months[now.getMonth()]+' '+now.getDate();
  const shortDate=days[now.getDay()].slice(0,3)+', '+smonths[now.getMonth()]+' '+now.getDate();
  document.getElementById('lockTime').textContent=timeStr;
  document.getElementById('lockDate').textContent=dateStr;
  document.getElementById('homeClock').textContent=timeStr;
  document.getElementById('homeTimeSmall').textContent=timeStr;
  document.getElementById('homeDate').textContent=dateStr;
}

function buildApps(){
  const grid=document.getElementById('appsGrid');
  grid.innerHTML=apps.map((a,i)=>`
    <div class="app-icon" onclick="openApp('${a.label}','${a.icon}','${a.desc}')">
      <div class="app-icon-img" style="background:${a.bg}">${a.icon}</div>
      <div class="app-label">${a.label}</div>
    </div>`).join('');
  const dock=document.getElementById('dock');
  dock.innerHTML=dockApps.map(a=>`
    <div class="dock-icon" style="background:${a.bg}" onclick="openApp('${a.label}','${a.icon}','${a.desc}')">${a.icon}</div>`).join('');
}

function showPassword(){
  document.getElementById('lockScreen').classList.add('hidden');
  const ps=document.getElementById('passwordScreen');
  ps.classList.remove('hidden');
  ps.classList.add('slide-up');
  pinEntered='';
  updateDots();
  document.getElementById('pwInput').value='';
  document.getElementById('pwError').textContent='';
}

function toggleEye(){
  showPw=!showPw;
  document.getElementById('pwInput').type=showPw?'text':'password';
  document.getElementById('eyeBtn').textContent=showPw?'&#128064;':'&#128065;';
}

function pressKey(k){
  if(pinEntered.length>=4)return;
  pinEntered+=k;
  document.getElementById('pwInput').value=pinEntered;
  updateDots();
  if(pinEntered.length===4) setTimeout(checkPin,300);
}

function deleteKey(){
  pinEntered=pinEntered.slice(0,-1);
  document.getElementById('pwInput').value=pinEntered;
  updateDots();
  document.getElementById('pwError').textContent='';
}

function onPwType(val){
  pinEntered=val.slice(0,4);
  document.getElementById('pwInput').value=pinEntered;
  updateDots();
  if(pinEntered.length===4) setTimeout(checkPin,200);
}

function updateDots(){
  for(let i=0;i<4;i++){
    document.getElementById('d'+i).classList.toggle('filled',i<pinEntered.length);
  }
}

function checkPin(){
  if(pinEntered===CORRECT_PIN){
    document.getElementById('pwError').textContent='';
    document.getElementById('passwordScreen').classList.add('hidden');
    const hs=document.getElementById('homeScreen');
    hs.classList.remove('hidden');
    hs.classList.add('fade-in');
  } else {
    document.getElementById('pwError').textContent='Wrong passcode. Try 1234';
    pinEntered='';
    document.getElementById('pwInput').value='';
    updateDots();
    const dots=document.getElementById('pwDots');
    dots.style.animation='none';
    dots.offsetHeight;
    dots.style.animation='shake 0.4s ease';
  }
}

function openApp(name,icon,desc){
  document.getElementById('openTitle').textContent=name;
  document.getElementById('openIcon').innerHTML=icon;
  document.getElementById('openName').textContent=name;
  document.getElementById('openDesc').textContent=desc;
  document.getElementById('openScreen').classList.remove('hidden');
  document.getElementById('openScreen').classList.add('fade-in');
}

function closeApp(){
  document.getElementById('openScreen').classList.add('hidden');
  document.getElementById('openScreen').classList.remove('fade-in');
}

const style=document.createElement('style');
style.textContent='@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}';
document.head.appendChild(style);

makeStars();
buildApps();
updateTime();
setInterval(updateTime,1000);
</script>
